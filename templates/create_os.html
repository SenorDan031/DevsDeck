<!-- 
This page will allow the user to create and deploy their WebOS 
-->

{% extends "base_os.html" %}

{% block title %}
Create OS
{% endblock %}

{% block BODY %}

<link rel="stylesheet"
href="{{ url_for('static', filename='CREATE_OS_STYLE.css') }}">

<div class="crt-screen">

    <div class="crt-container">

        <h1 class="title">
            DEVSDECK OS CONFIGURATION
        </h1>

        <p class="subtitle">
            Configure your operating system before deployment.
        </p>

        <form method="POST">

            <!-- OS NAME -->

            <div class="field-group">

                <label>
                    SYSTEM > ENTER OS NAME
                </label>

                <input
                    type="text"
                    name="OS_name"
                    placeholder="YazOS"
                    required
                >

            </div>

            <!-- BACKGROUND TYPE -->

            <div class="field-group">

                <label>
                    SYSTEM > BACKGROUND SOURCE
                </label>

                <div class="radio-group">

                    <label>

                        <input
                            type="radio"
                            name="background_type"
                            value="color"
                            checked
                        >

                        SOLID COLOR

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="background_type"
                            value="wallpaper"
                        >

                        WALLPAPER URL

                    </label>

                </div>

            </div>

            <!-- COLOR SECTION -->

            <div
                id="color-section"
                class="field-group"
            >

                <label>
                    SYSTEM > SELECT COLOR
                </label>

                <div class="color-grid">

                    <label class="color-box green">

                        <input
                            type="radio"
                            name="background_color"
                            value="#39ff14"
                            checked
                        >

                        GREEN

                    </label>

                    <label class="color-box blue">

                        <input
                            type="radio"
                            name="background_color"
                            value="#00bfff"
                        >

                        BLUE

                    </label>

                    <label class="color-box red">

                        <input
                            type="radio"
                            name="background_color"
                            value="#ff3c3c"
                        >

                        RED

                    </label>

                    <label class="color-box purple">

                        <input
                            type="radio"
                            name="background_color"
                            value="#c770ff"
                        >

                        PURPLE

                    </label>

                </div>

            </div>

            <!-- WALLPAPER URL -->

            <div
                id="wallpaper-section"
                class="field-group"
                style="display:none;"
            >

                <label>
                    SYSTEM > WALLPAPER URL
                </label>

                <input
                    type="text"
                    name="wallpaper_url"
                    placeholder="https://..."
                >

            </div>

            <!-- PRIMARY COLOR -->

            <div class="field-group">

                <label>
                    SYSTEM > PRIMARY COLOR
                </label>

                <select name="primary_color">

                    <option value="#39ff14">
                        GREEN
                    </option>

                    <option value="#00bfff">
                        BLUE
                    </option>

                    <option value="#ff3c3c">
                        RED
                    </option>

                    <option value="#c770ff">
                        PURPLE
                    </option>

                </select>

            </div>

            <!-- FONT SIZE -->

            <div class="field-group">

                <label>
                    SYSTEM > FONT SIZE
                </label>

                <select name="font_size">

                    <option value="12">
                        12 PX
                    </option>

                    <option value="14">
                        14 PX
                    </option>

                    <option value="16" selected>
                        16 PX
                    </option>

                    <option value="18">
                        18 PX
                    </option>

                </select>

            </div>

            <!-- ANIMATIONS -->

            <div class="field-group">

                <label>

                    <input
                        type="checkbox"
                        name="animations_enabled"
                        checked
                    >

                    ENABLE ANIMATIONS

                </label>

            </div>

            <button
                type="submit"
                class="build-btn"
            >

                BUILD MY DECK

            </button>

        </form>

    </div>

</div>

<script>

const wallpaperRadio =
document.querySelector(
    'input[value="wallpaper"]'
);

const colorRadio =
document.querySelector(
    'input[value="color"]'
);

const wallpaperSection =
document.getElementById(
    "wallpaper-section"
);

const colorSection =
document.getElementById(
    "color-section"
);

wallpaperRadio.addEventListener(
    "change",
    () => {

        wallpaperSection.style.display =
            "block";

        colorSection.style.display =
            "none";

    }
);

colorRadio.addEventListener(
    "change",
    () => {

        wallpaperSection.style.display =
            "none";

        colorSection.style.display =
            "block";

    }
);

</script>

{% endblock %}
